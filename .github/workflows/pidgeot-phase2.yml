name: Pidgeot Phase 2 Probes

on:
  push:
    branches:
      - gpt/pidgeot-phase2-probes
    paths:
      - 'pidgeot_blind_bundle_v4/**'
      - '.github/workflows/pidgeot-phase2.yml'
  workflow_dispatch:

concurrency:
  group: pidgeot-phase2-probes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout benchmark branch
        uses: actions/checkout@v4

      - name: Clone Pokemon Showdown v0.11.11
        run: git clone --depth 1 --branch v0.11.11 https://github.com/smogon/pokemon-showdown.git ps

      - name: Setup Node with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ps/package-lock.json

      - name: Install Showdown dependencies
        working-directory: ps
        run: npm ci

      - name: Apply v4.1 overlay
        run: cp -R pidgeot_blind_bundle_v4/showdown_overlay/. ps/

      - name: Build Showdown
        working-directory: ps
        run: npm run build

      - name: Run v4.1 mechanics tests only
        working-directory: ps
        run: npx mocha --no-config --no-package test/sim/abilities/wingtipvortex.js --reporter dot

      - name: Run active Phase 2 probes and capture output
        id: phase2
        working-directory: ps
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.phase2-results"
          set +e
          npx mocha --no-config --no-package \
            test/sim/misc/pidgeot-phase2-v2.js \
            test/sim/misc/pidgeot-phase2-v4.js \
            test/sim/misc/pidgeot-phase2-v5.js \
            test/sim/misc/pidgeot-phase2-v6.js \
            --reporter spec 2>&1 | tee "$GITHUB_WORKSPACE/.phase2-results/latest.txt"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit readable probe output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .phase2-results/latest.txt
          git diff --cached --quiet || git commit -m "Record latest Pidgeot phase 2 probe output [skip ci]"
          git push

      - name: Fail workflow if Phase 2 probes failed
        if: steps.phase2.outputs.exit_code != '0'
        run: exit 1
